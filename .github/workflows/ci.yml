name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run release:tools:install
      - run: npm run release:verify
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
      - name: 审计应用全部依赖（漏洞告警）
        run: npm run release:audit -- application
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-application-audit
          path: release-result/
          if-no-files-found: warn

  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture_only
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run release:tools:install
      - run: npm run release:verify
        env:
          TEST_DATABASE_URL: postgresql://postgres:fixture_only@127.0.0.1:5432/postgres

  release-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/release/tools/package-lock.json
      - run: npm ci
      - run: npm ci --prefix scripts/release/tools
      - name: 审计发布工具全部依赖（漏洞告警）
        run: npm run release:audit -- tools
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-release-tools-audit
          path: release-result/
          if-no-files-found: warn
